name: Nix CI for Rocq 9.3 (ARM64)

on:
  pull_request:
  push:
    branches: [main, rocq-9.3-arm64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalman-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kalman:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: f1uctus
          extraPullNames: coq, coq-community, math-comp
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || !secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and install Kalman
        shell: bash
        run: |
          nix_file=default.nix
          source_args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            source_url="https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA"
            source_info=$(nix-prefetch-url --unpack --name source --print-path "$source_url")
            mapfile -t source_lines <<< "$source_info"
            source_hash="${source_lines[0]}"
            nix_file="${source_lines[1]}/default.nix"
            source_args=(--arg config "{ src = builtins.fetchTarball { url = \"$source_url\"; sha256 = \"$source_hash\"; }; }")
          fi
          kalman=$(nix-build "$nix_file" --no-out-link "${source_args[@]}" \
            --argstr bundle rocq-9.3 --argstr job kalman --cores 4 --max-jobs 1)
          printf 'Kalman ARM64 output: `%s`\n' "$kalman" >> "$GITHUB_STEP_SUMMARY"
          test -s "$kalman/lib/coq/9.3/user-contrib/Kalman/kalman.vo"
          test -s "$kalman/share/kalman/paper-data/rocq2typst.json"
          test -s "$kalman/share/kalman/paper-data/kalman_run_3d.json"
