name: Thesis PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [thesis-*]
    paths: [paper/**, theories/**, references/**, .github/workflows/thesis.yaml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cachix install
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Cachix setup f1uctus
        uses: cachix/cachix-action@v16
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: coq, coq-community, math-comp
          name: f1uctus

      - name: Copy paper/data JSON from Cachix-cached kalman build
        run: |
          kalman=$(nix-build --no-out-link --argstr bundle "rocq-9.1" --argstr job "kalman")
          mkdir -p paper/data
          rm -f paper/data/*.json
          cp "$kalman/share/kalman/paper-data/"*.json paper/data/

      - name: Install typst-djvu (@local)
        run: |
          mkdir -p paper/packages/local/djvu
          rm -rf paper/packages/local/djvu/0.1.0
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/F1uctus/typst-djvu \
            paper/packages/local/djvu/0.1.0

      - name: Install touying-unn-itmm (@local)
        run: |
          mkdir -p paper/packages/local/unn-itmm
          rm -rf paper/packages/local/unn-itmm/0.2.1
          git clone --depth 1 --branch v0.2.1 \
            https://github.com/F1uctus/touying-unn-itmm \
            paper/packages/local/unn-itmm/0.2.1

      # Версия typst фиксируется: раскладка страниц зависит от версии.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.0'

      # Шрифты берутся только из paper/fonts (байтовые копии локально
      # используемых файлов: Times New Roman, Iosevka Regular, Segoe UI
      # Emoji, Arial), системные шрифты раннера игнорируются. Это даёт
      # постраничное совпадение PDF с локальной сборкой (mscorefonts ставил
      # Times New Roman v2.82 с другой метрикой, и страницы съезжали).
      - name: Build PDFs and social preview
        env:
          TYPST_PACKAGE_PATH: paper/packages
        run: |
          typst compile paper/thesis.typ paper/thesis.pdf --root . \
            --package-path paper/packages --font-path paper/fonts \
            --ignore-system-fonts
          typst compile paper/slides.typ paper/slides.pdf --root . \
            --package-path paper/packages --font-path paper/fonts \
            --ignore-system-fonts
          typst compile paper/social-preview.typ paper/images/social-preview.png \
            -f png --pages 1 --root . \
            --package-path paper/packages --font-path paper/fonts \
            --ignore-system-fonts

      - name: Check social preview PNG is up to date
        run: git diff --exit-code paper/images/social-preview.png

      - uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: thesis-${{ github.run_number }}
          name: Thesis PDF
          files: |
            paper/thesis.pdf
            paper/slides.pdf
          make_latest: true
