name: Thesis PDF

on:
  workflow_dispatch:
  push:
    branches: [main, typst]
    tags: [thesis-*]
    paths: [paper/**, theories/**, references/**, .github/workflows/thesis.yaml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install typst-djvu (@local)
        run: |
          mkdir -p paper/packages/local/djvu
          rm -rf paper/packages/local/djvu/0.1.0
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/F1uctus/typst-djvu \
            paper/packages/local/djvu/0.1.0

      - uses: typst-community/setup-typst@v4

      - name: Install Times New Roman
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig ttf-mscorefonts-installer
          fc-cache -f
          fc-list | grep -i "times new roman"

      - name: Build PDFs
        env:
          TYPST_PACKAGE_PATH: paper/packages
        run: |
          typst compile paper/thesis.typ paper/thesis.pdf --root . --package-path paper/packages
          typst compile paper/slides.typ paper/slides.pdf --root . --package-path paper/packages

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: thesis-${{ github.run_number }}
          name: Thesis PDF
          files: |
            paper/thesis.pdf
            paper/slides.pdf
          make_latest: true
