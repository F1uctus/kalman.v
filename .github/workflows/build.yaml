# Follow https://github.com/coq-community/templates to regenerate from meta.yml.
name: Docker CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'mathcomp/mathcomp:2.5.0-rocq-prover-9.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'unn-rocq-kalman.opam'
          custom_image: ${{ matrix.image }}
